spring.application.name=prestamos

# Cambia estos datos por los de tu MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/bd_prestamos
spring.datasource.username=root
spring.datasource.password=CAMBIA_ESTA_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crea las tablas y actualiza el esquema al iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Documentacion Swagger
springdoc.swagger-ui.path=/swagger-ui.html
